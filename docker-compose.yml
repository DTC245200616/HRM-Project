
services:
  # ==================================
  # POSTGRESQL
  # ==================================
  postgres:
    image: postgres:16
    container_name: hrm-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hrm_db
      POSTGRES_USER: hrm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - hrm-database

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm_user -d hrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # PGADMIN
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrm-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - hrm-database

  # ==================================
  # BACKEND - NON-ROOT + HARDENING
  # ==================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hrm-backend
    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hrm_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: hrm_db
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - hrm-frontend
      - hrm-database

  # ==================================
  # NGINX REVERSE PROXY
  # ==================================
  nginx:
    image: nginx:stable-alpine
    container_name: hrm-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    expose:
      - "8081"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - hrm-frontend

  # ==================================
  # PROMETHEUS
  # ==================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hrm-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - hrm-monitoring

  # ==================================
  # GRAFANA
  # ==================================
  grafana:
    image: grafana/grafana:latest
    container_name: hrm-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      - prometheus

    networks:
      - hrm-monitoring

  # ==================================
  # CADVISOR - DOCKER MONITORING
  # ==================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hrm-cadvisor
    restart: unless-stopped

    # Cấu hình thực hành hiện tại
    # Cần hạn chế quyền trong bước bảo mật nâng cao
    privileged: true

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    devices:
      - /dev/kmsg:/dev/kmsg

    expose:
      - "8080"

    networks:
      - hrm-monitoring

  # ==================================
  # POSTGRESQL EXPORTER
  # ==================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: hrm-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "postgres:5432/hrm_db?sslmode=disable"
      DATA_SOURCE_USER: hrm_user
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "9187"

    networks:
      - hrm-database
      - hrm-monitoring

  # ==================================
  # NGINX EXPORTER
  # ==================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: hrm-nginx-exporter
    restart: unless-stopped

    command:
      - "--nginx.scrape-uri=http://nginx:8081/nginx_status"

    depends_on:
      - nginx

    expose:
      - "9113"

    networks:
      - hrm-frontend
      - hrm-monitoring

  # ==================================
  # LOKI
  # ==================================
  loki:
    image: grafana/loki:3.5.12
    container_name: hrm-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - hrm-monitoring

  # ==================================
  # PROMTAIL
  # ==================================
  promtail:
    image: grafana/promtail:3.5.12
    container_name: hrm-promtail
    restart: unless-stopped

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    networks:
      - hrm-monitoring

# ==================================
# NETWORK ISOLATION
# ==================================
networks:
  hrm-frontend:
    driver: bridge

  hrm-database:
    driver: bridge

  hrm-monitoring:
    driver: bridge

# ==================================
# PERSISTENT VOLUMES
# ==================================
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
