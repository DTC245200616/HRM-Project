
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus tự giám sát
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Giám sát tài nguyên container Docker
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Giám sát PostgreSQL
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Giám sát Nginx
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
